name: Cron CI

on:
  schedule:
    # Run at 01:00 on Monday.
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP
    uses: ./.github/workflows/php-lint.yml

  phpstan:
    name: PHPStan
    uses: ./.github/workflows/phpstan.yml

  # WooCommerce trunk, so a core change that breaks the migration shows up before it ships.
  php-tests:
    name: PHP
    needs: php-lint
    uses: ./.github/workflows/run-unit-tests.yml
    with:
      wc_ref: 'trunk'

  plugin-check:
    name: Plugin Check
    uses: ./.github/workflows/run-plugin-check.yml

  audit:
    name: Dependency advisories
    uses: ./.github/workflows/run-audit.yml

  handle-success:
    if: ${{ success() }}
    needs: [php-tests, phpstan, plugin-check, audit]
    name: Handle success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: success
          message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> passed."

  handle-cancelled:
    if: ${{ cancelled() }}
    needs: [php-tests, phpstan, plugin-check, audit]
    name: Handle cancellation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: cancelled
          message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> cancelled."

  handle-error:
    if: ${{ failure() }}
    needs: [php-tests, phpstan, plugin-check, audit]
    name: Handle failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: failure
          message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed."
