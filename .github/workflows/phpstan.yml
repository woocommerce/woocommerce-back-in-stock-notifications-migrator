name: PHPStan

on:
  workflow_call:
    secrets:
      # Reads the private woocommerce/all-plugins repository for tools/php-stubs.
      ORG_DOWNLOADS:
        required: false

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      # Plugins without tools/php-stubs have no integration stubs to install.
      - name: Install integration stubs
        if: hashFiles('tools/php-stubs/composer.json') != ''
        env:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
          # Outside the cached directory: the private stubs archive must never reach actions/cache.
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/php-stubs-cache
        run: |
          # Without the token (fork pull requests) the private repository is unreadable and this step fails.
          if [[ -n "$ORG_DOWNLOADS" ]]; then
            export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$ORG_DOWNLOADS\"}}"
          fi
          composer install --prefer-dist --no-scripts --no-progress --no-interaction --working-dir=tools/php-stubs
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Check stub pins against the declared minimums
        if: hashFiles('tools/php-stubs/vendor/woocommerce/php-stubs/check-pins.php') != ''
        run: php tools/php-stubs/vendor/woocommerce/php-stubs/check-pins.php
      - run: composer phpstan
