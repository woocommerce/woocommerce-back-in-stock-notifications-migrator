name: PHP Unit Tests

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
      # `unit` runs config.sww.phpunit.legs, `integration` runs config.sww.integration.legs.
      suite:
        type: string
        default: unit
      # Empty, `latest` or `stable` keep each leg's default versions.
      wc-version:
        type: string
        default: ''
      wp-version:
        type: string
        default: ''
      php-version:
        type: string
        default: ''
      # Private plugins (config.sww.privatePlugins) come from the token that only trusted
      # (scheduled, dispatched or release) callers pass. Pull requests run without them, so
      # the tests that need them skip there.
      trusted-plugins:
        type: boolean
        default: false
      # Cron CI: also run the legs with `"scheduledOnly": true`.
      scheduled:
        type: boolean
        default: false
    secrets:
      ORG_DOWNLOADS:
        required: false

permissions:
  contents: read

jobs:

  config:
    name: Plan PHPUnit legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.config.outputs.json }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Read plugin metadata
        id: config
        run: bash bin/sww-config.sh --github-output

      - name: Resolve the legs
        id: matrix
        env:
          SUITE: ${{ inputs.suite }}
          SCHEDULED: ${{ inputs.scheduled }}
          REQUESTED_WP: ${{ inputs.wp-version != 'latest' && inputs.wp-version != 'stable' && inputs.wp-version || '' }}
          REQUESTED_WC: ${{ inputs.wc-version != 'latest' && inputs.wc-version != 'stable' && inputs.wc-version || '' }}
          REQUESTED_PHP: ${{ inputs.php-version }}
          CONFIG: ${{ steps.config.outputs.json }}
        run: |
          # Sourced from https://github.com/WordPress/gutenberg/blob/d181ce44648e6af799264ccae0eb48d0237579ba/.github/workflows/unit-test.yml#L95
          if jq -e --arg suite "$SUITE" '(if $suite == "integration" then .integration else .phpunit end).legs | any(.wp == "previous")' <<< "$CONFIG" > /dev/null; then
            WP_VERSION_RESPONSE=$(curl --fail --silent --show-error --proto '=https' https://api.wordpress.org/core/stable-check/1.0/) || exit 1
            LATEST_WP_VERSION=$(printf '%s' "$WP_VERSION_RESPONSE" | jq -er '
              to_entries | map(select(.value == "latest")) |
              if length == 1 and (.[0].key | test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))
              then .[0].key else error("Latest WordPress version could not be found") end
            ')
            IFS='.' read -r LATEST_WP_MAJOR LATEST_WP_MINOR LATEST_WP_PATCH <<< "$LATEST_WP_VERSION"
            if [[ $LATEST_WP_MINOR == '0' ]]; then
              PREVIOUS_WP_SERIES="$((LATEST_WP_MAJOR - 1)).9"
            else
              PREVIOUS_WP_SERIES="${LATEST_WP_MAJOR}.$((LATEST_WP_MINOR - 1))"
            fi
            PREVIOUS_WP=$(printf '%s' "$WP_VERSION_RESPONSE" | jq -er --arg series "$PREVIOUS_WP_SERIES" '
              keys | map(select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$") and (. == $series or startswith($series + ".")))) |
              max_by(split(".") | map(tonumber)) // error("Previous WordPress version could not be found")
            ')
            export PREVIOUS_WP
          fi
          matrix=$(bash bin/sww-config.sh --phpunit-matrix)
          jq -e 'length > 0' <<< "$matrix" > /dev/null || { echo "::error::No PHPUnit legs for the $SUITE suite."; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "- \(.label)"' <<< "$matrix" >> "$GITHUB_STEP_SUMMARY"

  php-unit-tests:
    name: ${{ matrix.label }}
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.json)[inputs.suite == 'integration' && 'integration' || 'phpunit'].timeoutMinutes }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.config.outputs.matrix) }}

    env:
      RUN_UNIT_TESTS: 1
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WC_CORE_DIR: /tmp/woocommerce
      WP_VERSION: ${{ matrix.wp }}
      WC_VERSION: ${{ matrix.wc }}
      PHP_VERSION: ${{ matrix.php }}
      LEG: ${{ toJSON(matrix) }}

    steps:

      # Before checkout, so the token never reaches a step that runs repository code.
      - name: Download private plugins
        if: ${{ inputs.trusted-plugins && toJSON(fromJSON(needs.config.outputs.json).privatePlugins) != '[]' }}
        env:
          GH_TOKEN: ${{ secrets.ORG_DOWNLOADS }}
          SUITE: ${{ inputs.suite }}
          PLUGINS: ${{ toJSON(fromJSON(needs.config.outputs.json).privatePlugins) }}
        run: |
          plugins_dir="$RUNNER_TEMP/plugins"
          mkdir -p "$plugins_dir" "$RUNNER_TEMP/plugin-zips"
          echo "SWW_PRIVATE_PLUGINS_DIR=$plugins_dir" >> "$GITHUB_ENV"
          while IFS= read -r plugin; do
            slug=$(jq -er '.slug | select(test("^[a-z0-9]+(-[a-z0-9]+)*$"))' <<< "$plugin")
            zip="$RUNNER_TEMP/plugin-zips/$slug.zip"
            # The leg's release of this plugin: empty for the latest, a tag, or `<x.y.z` for the
            # newest release older than x.y.z (config.sww.phpunit.legs[].plugins).
            version=$(jq -r --arg slug "$slug" '.pluginVersions[$slug] // ""' <<< "$LEG")
            source=$(jq -r .source <<< "$plugin")
            if [[ -n "$version" && "$source" != release ]]; then
              echo "::error::$slug: a leg can pin only release plugins."
              exit 1
            fi
            if [[ "$version" == '<'* ]]; then
              minimum=${version#<}
              version=$(gh release list --repo "woocommerce/$slug" --limit 100 --json tagName --jq '.[].tagName' |
                grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | { cat; echo "$minimum"; } | sort -V -u |
                awk -v minimum="$minimum" '$0 == minimum { print previous; exit } { previous = $0 }')
              [[ -n "$version" ]] || { echo "::error::Found no $slug release older than $minimum."; exit 1; }
            fi
            [[ -z "$version" || "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]] || { echo "::error::Invalid $slug release '$version'."; exit 1; }
            case $source in
              release)
                gh release download ${version:+"$version"} --repo "woocommerce/$slug" --pattern "$slug.zip" --output "$zip"
                echo "$slug release: ${version:-latest}" | tee -a "$GITHUB_STEP_SUMMARY"
                ;;
              all-plugins)
                gh api -H 'Accept: application/vnd.github.raw' "repos/woocommerce/all-plugins/contents/product-packages/$slug/$slug.zip" > "$zip"
                ;;
              wordpress.org)
                curl --fail --silent --show-error --location --proto '=https' --output "$zip" "https://downloads.wordpress.org/plugin/$slug.latest-stable.zip"
                ;;
              *)
                echo "::error::Unknown source for $slug."
                exit 1
                ;;
            esac
            unzip -q "$zip" -d "$plugins_dir"
            test -f "$plugins_dir/$slug/$slug.php"
            if [[ $(jq -r .hookOnly <<< "$plugin") != true ]]; then
              dir_env=$(jq -r .dirEnv <<< "$plugin")
              require_env=$(jq -r .requireEnv <<< "$plugin")
              [[ -z "$dir_env" ]] || echo "$dir_env=$plugins_dir/$slug" >> "$GITHUB_ENV"
              # Makes the tests that need the plugin fail, not skip, when it did not load.
              [[ -z "$require_env" ]] || echo "$require_env=1" >> "$GITHUB_ENV"
            fi
            echo "Downloaded $slug."
          done < <(jq -c --arg suite "$SUITE" '.[] | select(.suites | index($suite))' <<< "$PLUGINS")

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      # Hook-provisioned legs may build assets or start wp-env (bin/hooks/php-tests-provision.sh
      # runs `pnpm install` itself).
      - name: Set up pnpm
        if: matrix.provision == 'hook' && fromJSON(needs.config.outputs.json).capabilities.js
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup node version
        if: matrix.provision == 'hook' && fromJSON(needs.config.outputs.json).capabilities.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: ${{ inputs.checkout-ref == '' && 'pnpm' || '' }}
          package-manager-cache: ${{ inputs.checkout-ref == '' }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          # Without pcov.directory, pcov only instruments src/, lib/ or app/ when one of them exists.
          ini-values: ${{ fromJSON(needs.config.outputs.json).phpunit.ini != '' && format('{0}, pcov.directory=.', fromJSON(needs.config.outputs.json).phpunit.ini) || 'pcov.directory=.' }}
          # WP-CLI for hook-provisioned legs.
          tools: composer, wp-cli
          # Pass an empty token so setup-php doesn't persist GITHUB_TOKEN to Composer's
          # config. Composer rejects the new GITHUB_TOKEN token format.
          # See: https://github.com/composer/composer/issues/12849
          github-token: ''

      - name: Install Subversion
        run: |
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get install -y subversion

      - name: Start MySQL
        run: |
          sudo systemctl start mysql.service
          mysql -V

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        if: inputs.checkout-ref == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-ansi --no-interaction --optimize-autoloader --ignore-platform-reqs
          echo "${PWD}/vendor/bin" >> "$GITHUB_PATH"

      # bin/install.sh installs WordPress to /tmp/wordpress, its test library to
      # /tmp/wordpress-tests-lib and WooCommerce (the exact requested tag) to /tmp/woocommerce.
      - name: Install WordPress and WooCommerce
        if: matrix.provision == 'install'
        run: bash ./bin/install.sh wordpress_test root root 127.0.0.1 "$WP_VERSION" "$WC_VERSION"

      # Suites that run elsewhere (for example in wp-env) provision their own site.
      - name: Provision the test site
        if: matrix.provision == 'hook'
        run: bash ./bin/hooks/php-tests-provision.sh

      - name: Version information
        if: matrix.provision == 'install'
        run: |
          php -v
          INSTALLED_WP_VERSION=$(php -r 'require "/tmp/wordpress/wp-includes/version.php"; echo $wp_version;')
          INSTALLED_WC_VERSION=$(awk '/^[[:space:]]*\*[[:space:]]*Version:/{print $NF; exit}' /tmp/woocommerce/woocommerce.php)
          printf 'PHP %s, WordPress %s, WooCommerce %s (requested: WordPress %s, WooCommerce %s).\n' \
            "$(php -r 'echo PHP_VERSION;')" "$INSTALLED_WP_VERSION" "$INSTALLED_WC_VERSION" "$WP_VERSION" "$WC_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ $(jq -r .floor <<< "$LEG") == true ]]; then
            php -r 'exit(version_compare($argv[1], $argv[2], "==") ? 0 : 1);' "$INSTALLED_WP_VERSION" "$WP_VERSION" || { echo "::error::WordPress $INSTALLED_WP_VERSION installed, expected $WP_VERSION"; exit 1; }
            php -r 'exit(version_compare($argv[1], $argv[2], "==") ? 0 : 1);' "$INSTALLED_WC_VERSION" "$WC_VERSION" || { echo "::error::WooCommerce $INSTALLED_WC_VERSION installed, expected $WC_VERSION"; exit 1; }
          fi

      - name: Run PHPUnit
        env:
          COVERAGE_ARGS: ${{ matrix.coverage && '--coverage-clover coverage/clover.xml' || '' }}
        run: |
          eval "$(jq -r '.env | to_entries[] | select(.key | test("^[A-Z][A-Z0-9_]*$")) | "export \(.key)=\(.value | tostring | @sh)"' <<< "$LEG")"
          # shellcheck disable=SC2086 # COVERAGE_ARGS is a word list.
          composer run "$(jq -r .script <<< "$LEG")" -- $COVERAGE_ARGS

      - name: Upload coverage report
        if: always() && hashFiles('coverage/clover.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-php-${{ inputs.suite }}
          path: coverage/
          retention-days: 90

      - name: Coverage summary
        if: always() && hashFiles('coverage/clover.xml') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage/clover.xml').getroot().find('project/metrics')
          s, c = int(m.get('statements')), int(m.get('coveredstatements'))
          print(f"PHP line coverage: {c}/{s} ({100 * c / s:.1f}%)" if s else "PHP line coverage: no statements")
          PY

      # Extra runs that need their own process, such as a group that loads another plugin.
      - name: Run repository PHPUnit steps
        if: hashFiles('bin/hooks/php-tests.sh') != ''
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          eval "$(jq -r '.env | to_entries[] | select(.key | test("^[A-Z][A-Z0-9_]*$")) | "export \(.key)=\(.value | tostring | @sh)"' <<< "$LEG")"
          SWW_PHPUNIT_SCRIPT=$(jq -r .script <<< "$LEG") bash bin/hooks/php-tests.sh
