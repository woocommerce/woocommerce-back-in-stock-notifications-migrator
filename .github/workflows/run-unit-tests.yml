name: PHP unit tests

on:
  workflow_call:
    inputs:
      wc_ref:
        description: WooCommerce monorepo tag or branch the suite runs against.
        required: true
        type: string
      wp_version:
        description: WordPress version for the PHP 8.4 legs. The floor leg always runs 7.0.
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  test:
    # The floor leg runs the oldest PHP and WordPress the plugin supports (7.4 and 7.0, the
    # minimum WooCommerce 11.2 sets); the others run a current PHP. `MultisiteTests` skips
    # itself off a network install, so without the multisite leg its coverage silently never
    # executes.
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PHP 7.4, WordPress 7.0
            php: '7.4'
            wp: '7.0'
            multisite: '0'
          - label: PHP 8.4
            php: '8.4'
            wp: ${{ inputs.wp_version }}
            multisite: '0'
          - label: PHP 8.4, multisite
            php: '8.4'
            wp: ${{ inputs.wp_version }}
            multisite: '1'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WC_VERSION_TAG: ${{ inputs.wc_ref }}
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WC_CORE_DIR: ${{ github.workspace }}/woocommerce/plugins/woocommerce
      # Read by the WordPress test bootstrap, which treats anything but `1` as single site.
      WP_MULTISITE: ${{ matrix.multisite }}
      WP_VERSION: ${{ matrix.wp }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Checkout WooCommerce
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woocommerce/woocommerce
          ref: ${{ env.WC_VERSION_TAG }}
          path: woocommerce

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: mysqli

      - name: Install Subversion
        run: |
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get install -y subversion

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('plugin/composer.lock', 'woocommerce/plugins/woocommerce/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install plugin dependencies
        working-directory: plugin
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install WooCommerce dependencies
        working-directory: woocommerce/plugins/woocommerce
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

      # `includes/react-admin/feature-config.php` is generated by the monorepo build and is
      # gitignored, but WooCommerce loads it on `init`, so the bootstrap fatals without it.
      # The generator is plain PHP over a tracked JSON config, so this avoids a full pnpm build.
      - name: Generate WooCommerce feature config
        working-directory: woocommerce/plugins/woocommerce
        run: |
          mkdir -p includes/react-admin
          php bin/generate-feature-config.php

      - name: Install the WordPress test library
        run: bash "${WC_CORE_DIR}/tests/bin/install.sh" wordpress_test root '' 127.0.0.1 "${WP_VERSION}" true

      - name: Run PHPUnit
        working-directory: plugin
        run: composer run test
