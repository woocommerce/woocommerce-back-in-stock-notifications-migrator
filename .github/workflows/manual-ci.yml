# Temporary validation branch; do not merge.
name: Ubuntu 26.04 validation
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ubuntu-26-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  php-lint:
    name: PHP
    uses: ./.github/workflows/php-lint.yml
  phpstan:
    name: PHPStan
    uses: ./.github/workflows/phpstan.yml
  php-tests:
    name: PHP
    uses: ./.github/workflows/run-unit-tests.yml
    with:
      wc_ref: trunk
  plugin-check:
    name: Plugin Check
    uses: ./.github/workflows/run-plugin-check.yml
  extra-build-upload-zip:
    name: Build and Upload zip
    uses: ./.github/workflows/build-upload-zip.yml
  extra-spell-check:
    name: Spell Check
    uses: ./.github/workflows/spell-check.yml
