name: Test Runner

on:
  workflow_dispatch:
    inputs:
      wp-version:
        description: 'WordPress version for the PHP 8.4 legs: `latest`, `nightly` or a version number. The floor leg always runs 7.0.'
        type: string
        default: 'latest'
      wc-ref:
        description: 'WooCommerce monorepo tag or branch, e.g. `11.2.0-dev` or `trunk`.'
        type: string
        default: '11.2.0-dev'
      extension-tests:
        description: 'Extension Tests'
        type: choice
        default: 'All'
        options:
          - 'Unit Tests'
          - 'Plugin Check'
          - 'All'

run-name: Tests with WP-${{ inputs.wp-version }} - WC-${{ inputs.wc-ref }} - Tests ${{ inputs.extension-tests }}

permissions:
  contents: read

jobs:
  # PHP: the suite always runs its own versions (7.4 on WordPress 7.0, and 8.4).
  php-tests:
    if: ${{ contains(inputs.extension-tests, 'All') || contains(inputs.extension-tests, 'Unit') }}
    name: PHP
    uses: ./.github/workflows/run-unit-tests.yml
    with:
      wc_ref: ${{ inputs.wc-ref }}
      wp_version: ${{ inputs.wp-version }}

  build_project:
    if: ${{ contains(inputs.extension-tests, 'All') || contains(inputs.extension-tests, 'Plugin Check') }}
    name: Package
    uses: ./.github/workflows/build-upload-zip.yml
    with:
      checkout-ref: ${{ github.sha }}

  plugin-check:
    if: ${{ contains(inputs.extension-tests, 'All') || contains(inputs.extension-tests, 'Plugin Check') }}
    name: Plugin Check
    needs: build_project
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/run-plugin-check.yml
    with:
      artifact-id: ${{ needs.build_project.outputs.artifact-id }}
      source-sha: ${{ needs.build_project.outputs.source-sha }}
      expected-source-sha: ${{ github.sha }}
      sha256: ${{ needs.build_project.outputs.sha256 }}

  report-run:
    name: Report test selection and outcomes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [php-tests, build_project, plugin-check]
    env:
      WP_VERSION: ${{ inputs.wp-version }}
      WC_REF: ${{ inputs.wc-ref }}
      EXTENSION_TESTS: ${{ inputs.extension-tests }}
      PHP_TESTS_RESULT: ${{ needs.php-tests.result }}
      BUILD_PROJECT_RESULT: ${{ needs.build_project.result }}
      PLUGIN_CHECK_RESULT: ${{ needs.plugin-check.result }}
    steps:
      - name: Write the test summary
        run: |
          {
            printf '### Requested test environment\n\n'
            printf -- '- Requested WordPress: %s\n' "$WP_VERSION"
            printf -- '- Requested WooCommerce source ref: %s\n' "$WC_REF"
            printf -- '- Extension test selection: %s\n' "$EXTENSION_TESTS"
            printf '\n### Job outcomes\n\n'
            printf -- '- PHP tests: %s\n' "$PHP_TESTS_RESULT"
            printf -- '- Package: %s\n' "$BUILD_PROJECT_RESULT"
            printf -- '- Plugin Check: %s\n' "$PLUGIN_CHECK_RESULT"
            printf '\nInstalled versions appear in the PHP job logs.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  handle-success:
    if: |
      always() &&
      (needs.php-tests.result == 'success' || needs.php-tests.result == 'skipped') &&
      (needs.plugin-check.result == 'success' || needs.plugin-check.result == 'skipped') &&
      (needs.build_project.result == 'success' || needs.build_project.result == 'skipped')
    needs: [php-tests, plugin-check, build_project]
    name: Handle success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: success
          message: "Test Runner Workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> passed."

  handle-cancelled:
    if: cancelled()
    needs: [php-tests, plugin-check, build_project]
    name: Handle cancellation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: cancelled
          message: "Test Runner Workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> cancelled."

  handle-error:
    if: failure()
    needs: [php-tests, plugin-check, build_project]
    name: Handle failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: failure
          message: "Test Runner Workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed."
