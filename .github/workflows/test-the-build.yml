name: Test the build

# Posts a "Test the build" comment on every pull request, drafts included, with three ways
# to try the build: Jetpack Beta, Jurassic Ninja and WordPress Playground.
#
# WordPress Playground runs in the visitor's browser and can only fetch public URLs. Its
# artifact proxy serves this workflow's artifacts for the pull request and finds the
# workflow by the name above, which the link reads from GITHUB_WORKFLOW.
#
# Dependabot pull requests are skipped: their token cannot comment, and a dependency bump
# of the development tooling does not change the build.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the pull request's code (the npm script and bin/build-zip.sh) with a read-only
  # token and no secrets.
  build:
    name: Build
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    uses: ./.github/workflows/build-upload-zip.yml

  # Holds the token that can comment and the Jetpack Beta Builder secret, so it runs no
  # code from the pull request: it repackages the build and copies the preview files.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      # The folder WordPress installs the plugin under, and the name of its main file.
      PLUGIN_SLUG: back-in-stock-notifications-migrator-for-woocommerce
      # What build-upload-zip.yml names the zip inside its artifact.
      BUILD_ZIP: woocommerce-back-in-stock-notifications-migrator.zip
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      # The preview seeds its sample data with the helper the PHPUnit suite already uses to
      # create the legacy tables, so the schema is written down once.
      - name: Checkout the Playground preview files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/playground
            tests/php/Helpers
          persist-credentials: false

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: acceptance-test-zip
          path: ${{ runner.temp }}/build

      # One artifact holds the plugin zip and the preview files, so a Playground link can
      # never pair files from two runs. The artifact proxy also refuses artifacts under
      # 3000 bytes, which the preview files alone could be.
      - name: Package the Playground preview
        run: |
          unzip -q "$RUNNER_TEMP/build/$BUILD_ZIP" -d "$RUNNER_TEMP/plugin"
          test -f "$RUNNER_TEMP/plugin/$PLUGIN_SLUG/$PLUGIN_SLUG.php"

          mkdir -p "$RUNNER_TEMP/preview/tests/playground" "$RUNNER_TEMP/preview/tests/php/Helpers"
          cp "$RUNNER_TEMP/build/$BUILD_ZIP" "$RUNNER_TEMP/preview/$PLUGIN_SLUG.zip"
          cp tests/playground/preview.php tests/playground/setup.php "$RUNNER_TEMP/preview/tests/playground/"
          cp tests/php/Helpers/LegacyStore.php "$RUNNER_TEMP/preview/tests/php/Helpers/"

      # The link downloads the artifact on every click, so it is kept for longer than a
      # build artifact. The run ID in the name ties a link to the build of one run.
      - name: Upload the Playground preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playground-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/preview
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      # Jetpack Beta and Jurassic Ninja both install pull request builds through the Jetpack
      # Beta Builder. It only accepts builds of a plugin that is registered with it, sent with
      # that plugin's webhook secret. Without the secret the next three steps are skipped and
      # the comment says that the two options are not available. Fork pull requests never get
      # the secret.
      - name: Check for the Jetpack Beta Builder secret
        id: beta
        env:
          SECRET: ${{ secrets.JETPACK_BETA_BUILDER_SECRET }}
        run: |
          if [ -n "$SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No JETPACK_BETA_BUILDER_SECRET secret: the build was not sent to the Jetpack Beta Builder."
          fi

      # The Jetpack Beta Builder expects the folder <slug>-dev inside <slug>-dev.zip, so the
      # build installs next to the released plugin, and reads the version from readme.txt.
      - name: Package the build for the Jetpack Beta Builder
        id: beta-build
        if: ${{ steps.beta.outputs.configured == 'true' }}
        run: |
          DEV_DIR="$RUNNER_TEMP/beta/$PLUGIN_SLUG-dev"
          mkdir -p "$RUNNER_TEMP/beta"
          cp -R "$RUNNER_TEMP/plugin/$PLUGIN_SLUG" "$DEV_DIR"

          CURRENT_VERSION=$( sed -n 's/^ \* Version: *//p' "$DEV_DIR/$PLUGIN_SLUG.php" | head -n 1 )
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the plugin version from the build."
            exit 1
          fi
          NEXT_VERSION=$( echo "$CURRENT_VERSION" | awk -F. '{ print $1 "." $2 "." ( $3 + 1 ) }' )
          DEV_VERSION="${NEXT_VERSION}-dev_PR-${PR_NUMBER}_commit-${PR_HEAD_SHA:0:7}"

          sed -i "s/^ \* Version: .*$/ * Version: ${DEV_VERSION}/" "$DEV_DIR/$PLUGIN_SLUG.php"
          sed -i "s/define( 'WC_BIS_MIGRATOR_VERSION', '[^']*' )/define( 'WC_BIS_MIGRATOR_VERSION', '${DEV_VERSION}' )/" "$DEV_DIR/$PLUGIN_SLUG.php"
          sed -i "s/^Stable tag: .*$/Stable tag: ${DEV_VERSION}/" "$DEV_DIR/readme.txt"

          # Fail when a replacement did not happen, instead of sending a mislabeled build.
          grep -qF " * Version: ${DEV_VERSION}" "$DEV_DIR/$PLUGIN_SLUG.php"
          grep -qF "'WC_BIS_MIGRATOR_VERSION', '${DEV_VERSION}'" "$DEV_DIR/$PLUGIN_SLUG.php"
          grep -qF "Stable tag: ${DEV_VERSION}" "$DEV_DIR/readme.txt"

          ( cd "$RUNNER_TEMP/beta" && zip -q -r "$PLUGIN_SLUG-dev.zip" "$PLUGIN_SLUG-dev" && rm -rf "$PLUGIN_SLUG-dev" )

          PLUGIN_DATA=$( jq -cn --arg slug "$PLUGIN_SLUG" --arg version "$DEV_VERSION" '{ ($slug): { version: $version } }' )
          echo "plugin-data=$PLUGIN_DATA" >> "$GITHUB_OUTPUT"

      - name: Upload the build for the Jetpack Beta Builder
        if: ${{ steps.beta.outputs.configured == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugins # The name the Jetpack Beta Builder looks for.
          path: ${{ runner.temp }}/beta
          if-no-files-found: error
          overwrite: true
          # The Jetpack Beta Builder copies it right away.
          retention-days: 1

      # A build the Jetpack Beta Builder refuses must not fail the job: the Playground link
      # still works, and the comment says that the other two options are not available.
      - name: Send the build to the Jetpack Beta Builder
        id: beta-webhook
        if: ${{ steps.beta.outputs.configured == 'true' }}
        continue-on-error: true
        env:
          SECRET: ${{ secrets.JETPACK_BETA_BUILDER_SECRET }}
          PLUGIN_DATA: ${{ steps.beta-build.outputs.plugin-data }}
        run: |
          # GITHUB_REF is refs/pull/<n>/merge here, so the branch is sent by name: it is what
          # Jetpack Beta and the Jurassic Ninja link look the build up by.
          curl --fail --silent --show-error --location \
            --url "https://betadownload.jetpack.me/gh-action.php?run_id=$GITHUB_RUN_ID&pr=$PR_NUMBER&commit=$GITHUB_SHA" \
            --form-string "repo=$GITHUB_REPOSITORY" \
            --form-string "branch=$PR_HEAD_REF" \
            --form-string "plugins=$PLUGIN_DATA" \
            --form-string "secret=$SECRET"

      # A link is playground.wordpress.net/# followed by the Blueprint as URI-encoded JSON.
      # An artifact is a zip of what was uploaded, so the Blueprint unzips it first. It never
      # asks for, or holds, a credential.
      - name: Build the WordPress Playground link
        id: playground
        run: |
          ARTIFACT_URL=$( jq -rn \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg pr "$PR_NUMBER" \
            --arg artifact "playground-preview-$GITHUB_RUN_ID" \
            '"https://playground.wordpress.net/plugin-proxy.php?org=\($org|@uri)&repo=\($repo|@uri)&workflow=\($workflow|@uri)&pr=\($pr|@uri)&artifact=\($artifact|@uri)"' )

          BLUEPRINT=$( jq -cn --arg artifact_url "$ARTIFACT_URL" --arg slug "$PLUGIN_SLUG" '
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              landingPage: "/wp-admin/admin.php?page=wc-status&tab=tools",
              preferredVersions: { php: "8.3", wp: "latest" },
              features: { networking: true },
              constants: { WC_BIS_MIGRATOR_PLAYGROUND_PREVIEW: true },
              steps: [
                { step: "login", username: "admin" },
                { step: "installPlugin", pluginData: { resource: "wordpress.org/plugins", slug: "woocommerce" }, options: { activate: true } },
                { step: "unzip", zipFile: { resource: "url", url: $artifact_url, caption: "Downloading the build of this pull request" }, extractToPath: "/tmp/pr" },
                { step: "installPlugin", pluginData: { resource: "vfs", path: "/tmp/pr/\($slug).zip" }, options: { activate: true } },
                { step: "mkdir", path: "/wordpress/wp-content/mu-plugins" },
                { step: "cp", fromPath: "/tmp/pr/tests/playground/preview.php", toPath: "/wordpress/wp-content/mu-plugins/wc-bis-migrator-playground-preview.php" },
                { step: "runPHP", code: "<?php require \"/wordpress/wp-load.php\"; require \"/tmp/pr/tests/playground/setup.php\";" }
              ]
            }' )

          echo "url=https://playground.wordpress.net/#$( jq -rn --argjson blueprint "$BLUEPRINT" '$blueprint|tojson|@uri' )" >> "$GITHUB_OUTPUT"

      # All three options are always listed, in the same order. One that cannot work for
      # this build keeps its heading and says what it needs, without a link.
      - name: Write the comment
        env:
          BETA_CONFIGURED: ${{ steps.beta.outputs.configured }}
          BETA_WEBHOOK: ${{ steps.beta-webhook.outcome }}
          PLAYGROUND_URL: ${{ steps.playground.outputs.url }}
        run: |
          BODY="$RUNNER_TEMP/comment.md"
          # Jurassic Ninja reads the branch from the query string. Slashes stay as they are.
          JN_BRANCH=$( jq -rn --arg branch "$PR_HEAD_REF" '$branch|@uri|gsub("%2F"; "/")' )
          README_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$PR_HEAD_SHA/tests/playground/README.md"

          {
            echo "<!-- test-the-build -->"
            echo "### Test the build"
            echo
            echo "This plugin moves what Back In Stock Notifications left in the database into WooCommerce's built-in stock notifications. Back In Stock Notifications is a paid extension, and none of the options below installs it. On a site that never had it, the migrator shows nothing in the admin. Options 1 and 2 need a site that has that data. Option 3 comes with sample data."
            echo
            echo "#### Option 1. Jetpack Beta"
            echo
            if [ "$BETA_CONFIGURED" = "true" ] && [ "$BETA_WEBHOOK" = "success" ]; then
              echo "- Install and activate [Jetpack Beta](https://jetpack.com/beta/#download-and-install)."
              echo "- Use this build by searching for PR number \`${PR_NUMBER}\` or branch name \`${PR_HEAD_REF}\` in your-test.site/wp-admin/admin.php?page=jetpack-beta&plugin=${PLUGIN_SLUG}"
              echo
              echo ":information_source: Jetpack Beta installs the migrator only. The site needs WooCommerce 11.2 or newer with the Customer stock notifications feature on, and data from Back In Stock Notifications. Use a test site or a copy of a store: the migration writes to the database."
            elif [ "$BETA_CONFIGURED" = "true" ]; then
              echo ":construction: Not available for this build. The Jetpack Beta Builder did not accept it; the \"Send the build to the Jetpack Beta Builder\" step of the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) says why."
            else
              echo ":construction: Not available yet. This build was not sent to the Jetpack Beta Builder, because the workflow run has no \`JETPACK_BETA_BUILDER_SECRET\` secret. To make this option work, register the plugin with the Jetpack Beta Builder and save its webhook secret under that name in this repository's Actions secrets. Pull requests from forks never get the secret."
            fi
            echo
            echo "#### Option 2. Jurassic Ninja - available for logged-in A12s"
            echo
            if [ "$BETA_CONFIGURED" = "true" ] && [ "$BETA_WEBHOOK" = "success" ]; then
              echo ":warning: Log in at [jurassic.ninja](https://jurassic.ninja/) first. Without a login, the link below takes you to the Jurassic Ninja homepage and no site is created."
              echo
              echo ":rocket: [Launch a JN site with this branch and sample products](https://jurassic.ninja/create/?jetpack-beta&nojetpack&woocommerce&woocommerce-import-sample-data&branches.${PLUGIN_SLUG}=${JN_BRANCH}) :rocket:"
              echo
              echo ":information_source: The new site has WooCommerce and this build, but no Back In Stock Notifications data, so the migration tool is not listed. To test there, turn on Customer stock notifications under WooCommerce > Settings > Advanced > Features, then install and activate your copy of Back In Stock Notifications and add some sign-ups."
            else
              echo ":construction: Not available yet. Jurassic Ninja installs the build of a pull request through Jetpack Beta, so it becomes available together with Option 1."
            fi
            echo
            echo "#### Option 3. WordPress Playground - runs in your browser"
            echo
            echo "- :test_tube: [Open this build with sample data](${PLAYGROUND_URL}): a store with WooCommerce set up, Customer stock notifications on, and sample Back In Stock Notifications data: nine subscribers, the extension's settings and one product with sign-ups switched off."
            echo "- It opens on WooCommerce > Status > Tools. Under \"Migrate Back In Stock Notifications subscribers\", select \"Start migration\", then reload the page. The migrated subscribers are under WooCommerce > Notifications."
            echo "- With a checkout of this branch you can start the same preview locally: see [tests/playground]($README_URL)."
            echo
            echo ":information_source: Back In Stock Notifications is not installed in the preview. The sample data stands in for what it leaves in the database, so the preview cannot show the warning about duplicate emails while that extension is active, or the refusal to start while it still has emails queued. A site in a browser tab has no WP-Cron, so the preview runs the background batches at the end of each admin page load. No email leaves the preview. The link stops working 14 days after the last build."
            echo
            echo "---"
            echo
            echo "Build info:"
            echo
            echo "- Latest commit: ${PR_HEAD_SHA}"
            echo "- Build time: $( date -u "+%Y-%m-%d %H:%M:%S UTC" )"
            echo
            echo "_Note: the build is updated when a new commit is pushed to this PR._"
          } > "$BODY"

          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"

      # The token of a fork pull request cannot comment. The text is in the run summary.
      - name: Add or update the comment on the pull request
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT_ID=$( gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select( .user.login == "github-actions[bot]" and ( .body | startswith( "<!-- test-the-build -->" ) ) ) | .id' | head -n 1 )

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F "body=@$RUNNER_TEMP/comment.md" --silent
            echo "Updated comment $COMMENT_ID."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$RUNNER_TEMP/comment.md" --silent
            echo "Created the comment."
          fi
