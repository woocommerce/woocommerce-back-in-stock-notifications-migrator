name: Test the build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: woocommerce/.github/.github/workflows/plugin-test-the-build.yml@203f4ce0cd601a0bafeda90b8975666b05cc0584 # shared @ 2026-11-17
    with:
      checkout-ref: ${{ github.sha }}
      plugin-slug: back-in-stock-notifications-migrator-for-woocommerce
      playground-files: |
        tests/playground/preview.php
        tests/playground/setup.php
        tests/php/Helpers/LegacyStore.php
