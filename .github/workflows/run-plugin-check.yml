name: Plugin Check

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      expected-source-sha:
        type: string
        required: true
      sha256:
        type: string
        required: true
      release:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  plugin-check:
    name: Plugin Check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Release unit tests already cover PHP 7.4.
        php: ${{ fromJSON(inputs.release && '["8.3"]' || '["7.4","8.3"]') }}

    env:
      PLUGIN_SLUG: back-in-stock-notifications-migrator-for-woocommerce

    steps:
      - name: Download the production ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: release-package

      - name: Verify and unpack the production ZIP
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
          ZIP_SHA256: ${{ inputs.sha256 }}
        run: |
          test -n "$EXPECTED_SOURCE_SHA"
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          zip_file="release-package/${GITHUB_REPOSITORY#*/}.zip"
          printf '%s  %s\n' "$ZIP_SHA256" "$zip_file" | sha256sum --check -
          unzip -q "$zip_file" -d build
          shopt -s dotglob nullglob
          entries=(build/*)
          if [[ ${#entries[@]} != 1 || ! -f "build/$PLUGIN_SLUG/$PLUGIN_SLUG.php" ]]; then
            echo "::error::The production ZIP must contain the expected plugin directory and main file."
            exit 1
          fi
          printf 'Plugin Check artifact `%s`, commit `%s`, SHA-256 `%s`.\n' \
            "$ARTIFACT_ID" "$SOURCE_SHA" "$ZIP_SHA256" >> "$GITHUB_STEP_SUMMARY"

      # The action names its results artifact using the optional slug. Use the
      # real slug on one leg and let the action infer it on the other.
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        with:
          build-dir: build/${{ env.PLUGIN_SLUG }}
          slug: ${{ matrix.php == '7.4' && env.PLUGIN_SLUG || '' }}
          repo-token: ''
