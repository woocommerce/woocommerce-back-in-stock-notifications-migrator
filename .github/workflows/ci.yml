name: Pull Request CI

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which kinds of files changed so each check runs only when its inputs change.
  # A workflow change counts as every kind of change, so CI edits exercise the whole
  # pipeline.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      php: ${{ steps.categories.outputs.php == 'true' || steps.categories.outputs.workflows == 'true' }}
      product: ${{ steps.product.outputs.product == 'true' || steps.categories.outputs.workflows == 'true' }}
      workflows: ${{ steps.categories.outputs.workflows }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: categories
        with:
          # `readme.txt`, `package.json` and `bin/` count as PHP: the lint job checks the
          # readme's `Stable tag` and changelog and the `package.json` version against the
          # plugin header with `bin/check_versions.sh`.
          # `changelog.txt` counts too: the isolated tests round-trip it through the
          # changelogger formatter.
          filters: |
            php:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpcs.xml.dist'
              - 'phpunit.xml.dist'
              - 'phpstan*.neon*'
              - 'tools/phpstan/**'
              - 'tests/isolated/**'
              - 'readme.txt'
              - 'package.json'
              - 'changelog.txt'
              - 'bin/**'
            workflows:
              - '.github/**'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: product
        with:
          # A file must satisfy EVERY pattern below to count as a product change. Without
          # this the action ORs them ('some', the default), so '**' matches on its own and
          # every '!' negation is dead code.
          predicate-quantifier: 'every'
          filters: |
            product:
              # Anything that can change the shipped zip: everything except tests, docs
              # and tooling config, all of which `.gitattributes` keeps out of it.
              - '**'
              - '!tests/**'
              - '!phpunit.xml.dist'
              - '!phpcs.xml.dist'
              - '!phpstan*.neon*'
              - '!tools/**'
              - '!changelog/**'
              - '!package.json'
              - '!**/*.md'
              - '!.coderabbit.yaml'
              - '!.wp-env.json'
              - '!.editorconfig'

  spelling:
    name: Spelling
    uses: ./.github/workflows/spell-check.yml

  php-lint:
    name: PHP
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/php-lint.yml

  phpstan:
    name: PHPStan
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/phpstan.yml

  actionlint:
    name: Workflow lint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint 1.7.12
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint

      # Embedded shell and Python snippets are not linted.
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes='

  # The jobs below run only for ready-for-review PRs.

  plugin-check:
    name: Plugin Check
    needs: changes
    if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.product == 'true' }}
    uses: ./.github/workflows/run-plugin-check.yml

  php-tests:
    name: PHP
    needs: changes
    if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/run-unit-tests.yml
    with:
      # The plugin's `WC requires at least` header (and `WC_BIS_MIGRATOR_MIN_WC_VERSION`) is
      # 11.2. WooCommerce hasn't tagged a stable 11.2.0 release yet, so this pins to the
      # `11.2.0-dev` tag, the closest real tag to that minimum. Bump this once 11.2.0 ships.
      wc_ref: '11.2.0-dev'

  # The single status that branch protection requires. It fails when any applicable check
  # failed, was cancelled, is missing or was skipped unexpectedly, and always fails on
  # drafts so a draft-era result can never satisfy branch protection once the PR is ready
  # for review.
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [changes, spelling, php-lint, phpstan, actionlint, plugin-check, php-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      CI_DRAFT: ${{ github.event.pull_request.draft }}
      CI_RESULTS: ${{ toJSON(needs) }}
      CI_EXPECTED: >-
        {
          "changes": true,
          "spelling": true,
          "php-lint": ${{ needs.changes.outputs.php == 'true' }},
          "phpstan": ${{ needs.changes.outputs.php == 'true' }},
          "actionlint": ${{ needs.changes.outputs.workflows == 'true' }},
          "plugin-check": ${{ github.event.pull_request.draft == false && needs.changes.outputs.product == 'true' }},
          "php-tests": ${{ github.event.pull_request.draft == false && needs.changes.outputs.php == 'true' }}
        }
    steps:
      - name: Check required results
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.CI_RESULTS);
          const expected = JSON.parse(process.env.CI_EXPECTED);
          let failed = false;
          for (const job of new Set([...Object.keys(expected), ...Object.keys(results)])) {
            const result = results[job]?.result;
            const passed = Object.hasOwn(expected, job) &&
              (result === 'success' || (result === 'skipped' && expected[job] === false));
            console.log(`${job}: ${result || 'missing'}${passed ? '' : ' (required check failed)'}`);
            failed ||= !passed;
          }
          if (process.env.CI_DRAFT === 'true') {
            console.log('::error::Draft PR: Plugin Check and PHP tests run once the PR is ready for review.');
            failed = true;
          }
          process.exitCode = failed ? 1 : 0;
          NODE
