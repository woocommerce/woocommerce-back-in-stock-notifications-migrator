name: PHP Coding Standards

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string

permissions:
  contents: read

jobs:

  config:
    name: Read plugin metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.config.outputs.json }}
    steps:
      - name: Checkout package metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
          sparse-checkout: |
            package.json
            bin/sww-config.sh
          sparse-checkout-cone-mode: false
      - name: Read config.sww
        id: config
        run: bash bin/sww-config.sh --github-output

  # One job per PHP version in config.sww.phpLint.php.
  php-coding-standards:
    name: Coding standards (PHP ${{ matrix.php }})
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.config.outputs.json).phpLint.php }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
          # SARB baselines and phpcs-changed compare against the base branch.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer, wp-cli
          # Pass an empty token so setup-php doesn't persist GITHUB_TOKEN to Composer's
          # config. Composer rejects the new GITHUB_TOKEN token format.
          # See: https://github.com/composer/composer/issues/12849
          # https://github.blog/changelog/2026-04-24-notice-about-upcoming-new-format-for-github-app-installation-tokens/
          github-token: ''

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        if: inputs.checkout-ref == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate Composer manifest and lockfile
        run: composer validate --no-check-all --no-check-publish

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-ansi --no-interaction --optimize-autoloader
          echo "${PWD}/vendor/bin" >> "$GITHUB_PATH"

      - name: Log debug information
        run: |
          php --version
          composer --version

      # The repository's PHP gate: syntax, PHPCS (baseline or changed lines) and any compatibility checks.
      - name: Run PHP checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: composer check:php

      - name: Run repository PHP checks
        if: hashFiles('bin/hooks/php-lint.sh') != ''
        run: bash bin/hooks/php-lint.sh

  # One job per PHP version in config.sww.phpLint.isolatedPhp.
  php-isolated-tests:
    name: Isolated tests (PHP ${{ matrix.php }})
    needs: config
    if: fromJSON(needs.config.outputs.json).capabilities.isolated
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.config.outputs.json).phpLint.isolatedPhp }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          github-token: ''

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        if: inputs.checkout-ref == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-ansi --no-interaction --optimize-autoloader

      - name: Run isolated PHP tests
        run: composer run test:php:isolated
