name: Build and Upload zip

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build_project:
        name: Build and upload
        runs-on: ubuntu-26.04
        timeout-minutes: 5

        steps:

            - name: Verify Ubuntu 26.04 runner
              shell: bash
              run: |
                . /etc/os-release
                printf "Runner OS: %s %s\n" "$ID" "$VERSION_ID"
                test "$ID" = ubuntu
                test "$VERSION_ID" = 26.04
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Plain PHP with no Node dependencies: the zip is a `git archive` of the checkout,
            # so the runner's own Node is enough to run the npm script.
            - name: Build
              run: npm run build:zip

            - name: Upload zip
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                name: acceptance-test-zip
                path: ${{ github.workspace }}/deploy/woocommerce-back-in-stock-notifications-migrator.zip
