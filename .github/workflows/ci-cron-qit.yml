name: Cron QIT

on:
  schedule:
    # Run at 02:00 on Wednesdays.
    - cron: '0 2 * * 3'

permissions:
  contents: read

jobs:

    config:
        name: Read plugin metadata
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          json: ${{ steps.config.outputs.json }}
        steps:
          - name: Checkout package metadata
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
              sparse-checkout: |
                package.json
                bin/sww-config.sh
              sparse-checkout-cone-mode: false
          - name: Read config.sww
            id: config
            run: bash bin/sww-config.sh --github-output

    # Plugins without QIT (config.sww.capabilities.qit false) skip every job below.
    setup:
        if: ${{ fromJSON(needs.config.outputs.json).capabilities.qit }}
        name: Setup environments
        needs: config
        uses: ./.github/workflows/setup-env.yml

    build_project:
        name: Package
        needs: [config, setup]
        uses: ./.github/workflows/build-upload-zip.yml
        with:
          qit-derivative: true

    qit-tests:
        name: QIT
        needs: [config, build_project]
        uses: ./.github/workflows/run-qit.yml
        secrets:
          ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
          ORG_PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
        with:
          extension: ${{ fromJSON(needs.config.outputs.json).qit.extension }}
          plugins: ${{ fromJSON(needs.config.outputs.json).qit.plugins }}
          artifact: 'acceptance-test-zip'
          derivative: ${{ fromJSON(needs.config.outputs.json).qit.derivativeExclude != '' && 'qit-derivative' || '' }}
          timeout-minutes: ${{ fromJSON(needs.config.outputs.json).qit.timeoutMinutes }}
          wp-version: 'nightly'
          wc-version: 'nightly'
          test-activation: ${{ 'true' }}
          test-security: ${{ 'true' }}
          test-phpcompatibility: ${{ 'true' }}
          test-validation: ${{ 'true' }}
          test-phpstan: ${{ 'false' }} # QIT PHPStan uses its own config (no repo bootstrap/baseline); the repo's PHPStan (phpstan.yml) is the gate.
          test-woo-api: ${{ 'true' }}
          test-woo-e2e: ${{ 'true' }}
          test-malware: ${{ 'true' }}
          test-api-fuzz: ${{ fromJSON(needs.config.outputs.json).qit.apiFuzz && 'true' || 'false' }}

    handle-success:
        if: ${{ success() && needs.qit-tests.result == 'success' }}
        needs: qit-tests
        name: Handle success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
              with:
                  status: success
                  message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> passed."

    handle-cancelled:
        if: ${{ cancelled() }}
        needs: qit-tests
        name: Handle cancellation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
              with:
                  status: cancelled
                  message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> cancelled."

    handle-error:
        if: ${{ failure() }}
        needs: qit-tests
        name: Handle failure
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
              with:
                  status: failure
                  message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed. You can find the results in the artifacts section."
