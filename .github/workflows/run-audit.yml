name: Dependency advisories

on:
  workflow_call:

permissions:
  contents: read

jobs:
  composer:
    name: Composer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      # Same thresholds as the other plugins' `audit:composer`. Reads the lock file only,
      # so nothing is installed.
      - name: Audit Composer dependencies
        run: composer audit --locked --no-plugins --no-scripts --abandoned=report --ignore-severity=low --ignore-severity=medium
