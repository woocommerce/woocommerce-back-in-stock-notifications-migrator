version: 2
updates:
  # SHA-pinned Actions get no Dependabot security alerts, so these monthly
  # version-update PRs are how the pins stay current. Review each bump; the
  # auto-merge workflow only merges security advisories.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'no changelog'
      - 'dependencies'

  # Version updates are off: Composer holds dev tooling only, and the plugin ships
  # without vendor/. Security updates still open PRs when the repository enables them.
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'no changelog'
      - 'dependencies'
